# Overlay for people who want the containers to be the source they just read.
# Opt-in; the default stack keeps pulling the GHCR images.
#
# Usage:
#   docker compose -f docker-compose.public.yml -f docker-compose.local-build.yml pull postgres redis
#   docker compose -f docker-compose.public.yml -f docker-compose.local-build.yml build --pull
#   docker compose -f docker-compose.public.yml -f docker-compose.local-build.yml up --pull never
#
# `:local` image names + pull_policy: never — Compose cannot quietly substitute
# the registry's `latest` for what was built here.

services:
  migrate:
    image: firemaster-backend:local
    pull_policy: never

  backend:
    image: firemaster-backend:local
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile

  celery-worker:
    image: firemaster-backend:local
    pull_policy: never

  celery-beat:
    image: firemaster-backend:local
    pull_policy: never

  frontend:
    image: firemaster-frontend:local
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports: !override
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"
    # Static assets + nginx only, so the dev-server mounts and env from
    # docker-compose.yml are reset if this overlay is ever stacked on that file.
    volumes: !reset []
    environment: !reset {}
