# FIREMaster — starter compose. Runs the whole app from prebuilt images. No source code,
# no git, no GitHub account needed. See GET_STARTED.md for the full walkthrough.
#
# First run:
#   1. docker compose run --rm --no-deps backend uv run python -m app.setup   (sets your admin password)
#      (--no-deps: setup only writes backend/.env, so it doesn't need postgres/redis running)
#   2. docker compose up                                            (starts everything)
#   3. open http://localhost:5173                                   (log in — the demo is live)
#
# Update later:   docker compose pull && docker compose up -d
# Stop:           docker compose down            (your data is kept)
#
# Do NOT delete the backend/.env file that ships in this folder — the setup step (1) fills it in.
# (It must exist as a file before first run; that's why an empty placeholder is included.)
#
# DEMO vs YOUR data: out of the box this runs on a demo persona. To use your OWN finances, connect
# Monarch — one command, see CONNECT_MONARCH.md. Your login is saved in the `monarch_session`
# volume, the app starts syncing, and the demo data is replaced automatically on the first sync.

services:
  postgres:
    image: postgres:16-alpine
    # Internal only: the containerized app does not need a host database port.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firemaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firemaster}
      POSTGRES_DB: ${POSTGRES_DB:-firemaster}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firemaster}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Internal only: Redis has no password and must not be published to the host.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies Alembic migrations, then (on an empty DB) seeds the demo persona, then
  # exits. The seed scripts are baked into the image at /app/scripts (the build context is the
  # repo root — see backend/Dockerfile), so `../scripts/seed_demo.py` resolves with no mount.
  # Seeing "migrate Exited (0)" in `docker compose ps` is NORMAL.
  migrate:
    image: ghcr.io/gdb-mtx/firemaster-backend:latest
    volumes:
      - ./backend/.env:/app/backend/.env   # runtime secrets (see header); NOT env_file
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-firemaster}@postgres:5432/${POSTGRES_DB:-firemaster}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-firemaster}@postgres:5432/${POSTGRES_DB:-firemaster}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-false}
      # First boot only: auto-seed the demo persona when the DB is empty. SEED_DEMO=false starts blank.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && (uv run python ../scripts/seed_demo.py --if-empty || true)"]

  backend:
    image: ghcr.io/gdb-mtx/firemaster-backend:latest
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend/.env:/app/backend/.env   # runtime secrets (see header); NOT env_file
      - monarch_session:/data              # persists the Monarch session across restarts; shared with celery
    environment:
      # Inside the container Postgres/Redis are reached by SERVICE NAME, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-firemaster}@postgres:5432/${POSTGRES_DB:-firemaster}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-firemaster}@postgres:5432/${POSTGRES_DB:-firemaster}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-false}
      MONARCH_SESSION_FILE: /data/.monarch_session   # on the shared volume so backend + celery all see it
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No --reload: there's no mounted source to watch (the code is baked into the image).
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery-worker:
    image: ghcr.io/gdb-mtx/firemaster-backend:latest
    volumes:
      - ./backend/.env:/app/backend/.env   # runtime secrets (see header); NOT env_file
      - monarch_session:/data              # shared Monarch session (the worker runs the sync task)
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-firemaster}@postgres:5432/${POSTGRES_DB:-firemaster}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-firemaster}@postgres:5432/${POSTGRES_DB:-firemaster}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-false}
      MONARCH_SESSION_FILE: /data/.monarch_session
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # -I app.tasks.sync_tasks is REQUIRED for task autodiscovery (matches the dev compose).
    command: uv run celery -A app.tasks.celery_app worker --loglevel=info -I app.tasks.sync_tasks

  celery-beat:
    image: ghcr.io/gdb-mtx/firemaster-backend:latest
    volumes:
      - ./backend/.env:/app/backend/.env   # runtime secrets (see header); NOT env_file
      - monarch_session:/data              # shared Monarch session (beat schedules the sync task)
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-firemaster}@postgres:5432/${POSTGRES_DB:-firemaster}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-firemaster}@postgres:5432/${POSTGRES_DB:-firemaster}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-false}
      MONARCH_SESSION_FILE: /data/.monarch_session
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uv run celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    image: ghcr.io/gdb-mtx/firemaster-frontend:latest
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    environment:
      # The Vite dev server proxies /api SERVER-SIDE (inside this container), so it must
      # reach the backend by service name, not localhost.
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  monarch_session:   # holds .monarch_session once you connect Monarch (see CONNECT_MONARCH.md)
