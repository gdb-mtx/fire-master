# Nginx config for the production frontend image (Dockerfile.prod).
# Serves the built SPA; API calls are relative /api and are routed by the
# reverse proxy in front (Caddy in the demo stack), never by nginx.
server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin /api for the local-build stack, where nothing sits in front of
    # nginx. (Behind Caddy, as on the demo, Caddy has already routed /api/* and this
    # block never sees it.) Buffering stays off so advisor streaming is not held.
    location /api/ {
        # proxy_pass through a variable: nginx then resolves "backend" per request
        # (see the resolver above) instead of once at startup, so a rebuilt backend
        # container with a fresh Docker IP keeps working without an nginx restart.
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA client-side routing: any path that isn't a real file serves index.html.
    # NB: no `$uri/` clause — the app has real routes (e.g. /assets, the Asset
    # Hub) and a directory match would 403 instead of falling through to the SPA.
    # index.html must ALWAYS revalidate (Jul 27): with no Cache-Control, browsers
    # heuristically cache it, so after a deploy a stale shell references purged
    # chunk hashes — sections silently vanish and every load retries dead URLs.
    # The etag makes revalidation a free 304; only the shell pays the round-trip.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed bundles under /static/ (see vite.config.ts
    # assetsDir — renamed from the default "assets" to avoid shadowing the
    # /assets app route). Real files only; safe to cache forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
